<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애니 감상 기록</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e3e;
    --accent: #7c6af0;
    --accent2: #a78bfa;
    --text: #e2e2f0;
    --text-muted: #7c7c99;
    --diamond:  #4fc3f7;
    --platinum: #26a69a;
    --gold:     #c8a234;
    --silver:   #9e9eb0;
    --bronze:   #8b5e3c;
    --ongoing:  #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 40px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  header h1 span { color: var(--accent2); }
  .header-stats { display: flex; justify-content: center; gap: 32px; margin-top: 20px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: var(--accent2); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── 탭 ── */
  .tabs {
    display: flex; gap: 4px;
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }
  .tab {
    padding: 10px 18px; border-radius: 8px 8px 0 0;
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-muted); transition: all 0.2s;
    white-space: nowrap; border: 1px solid transparent; border-bottom: none;
  }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { color: var(--accent2); background: var(--bg); border-color: var(--border); }

  /* ── 컨트롤 ── */
  .controls {
    display: flex; gap: 12px; align-items: center;
    padding: 16px 24px; background: var(--surface); flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  input[type="search"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px 9px 38px; color: var(--text);
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--text-muted); }
  select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px; color: var(--text);
    font-size: 14px; outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }
  .count-badge { font-size: 13px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
  .count-badge span { color: var(--accent2); font-weight: 600; }

  /* ── 메인 ── */
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  /* ── 시즌 섹션 ── */
  .season-section { margin-bottom: 40px; }
  .season-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .season-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .season-meta { display: flex; gap: 8px; align-items: center; }
  .season-count { font-size: 12px; color: var(--text-muted); background: var(--surface2); padding: 3px 10px; border-radius: 20px; }
  .season-avg { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .divider { flex: 1; height: 1px; background: var(--border); }

  /* ── 카드 ── */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); border-color: var(--accent); }
  .card-title { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; color: var(--text); word-break: keep-all; }
  .card-note { font-size: 11px; color: var(--text-muted); margin-top: -6px; margin-bottom: 8px; }
  .card-score { display: flex; align-items: center; gap: 6px; }
  .score-num { font-size: 22px; font-weight: 800; line-height: 1; }
  .score-max { font-size: 11px; color: var(--text-muted); }
  .stars { display: flex; gap: 2px; margin-top: 4px; }
  .star { font-size: 10px; }
  .ongoing-badge { font-size: 11px; font-weight: 600; color: var(--ongoing); background: rgba(148,163,184,0.1); padding: 4px 10px; border-radius: 20px; display: inline-block; }
  .genre-badge { font-size: 10px; font-weight: 500; color: #7dd3fc; background: rgba(125,211,252,0.1); padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 6px; margin-left: 4px; }

  /* 점수별 색상 (랭크) */
  .diamond::before  { background: linear-gradient(90deg, var(--diamond), #a8e8ff, var(--diamond)); background-size: 200% 100%; animation: shimmer 2.5s linear infinite; }
  .diamond .score-num { color: var(--diamond); text-shadow: 0 0 12px rgba(79,195,247,0.8); }
  .diamond { border-color: rgba(79,195,247,0.3); box-shadow: 0 0 12px rgba(79,195,247,0.08); }

  .platinum::before { background: linear-gradient(90deg, var(--platinum), #80cbc4, var(--platinum)); background-size: 200% 100%; animation: shimmer 2.5s linear infinite; }
  .platinum .score-num { color: var(--platinum); text-shadow: 0 0 10px rgba(38,166,154,0.7); }
  .platinum { border-color: rgba(38,166,154,0.3); box-shadow: 0 0 10px rgba(38,166,154,0.07); }

  .gold::before     { background-color: var(--gold);     } .gold     .score-num { color: var(--gold);     }
  .silver::before   { background-color: var(--silver);   } .silver   .score-num { color: var(--silver);   }
  .bronze::before   { background-color: var(--bronze);   } .bronze   .score-num { color: var(--bronze);   }
  .s-null::before   { background-color: var(--ongoing);  }

  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ── 로딩 / 에러 ── */
  .loading, .error-box {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px; text-align: center; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text-muted); font-size: 14px; }
  .error-icon { font-size: 40px; }
  .error-msg { color: var(--text-muted); font-size: 14px; max-width: 400px; line-height: 1.6; }
  .retry-btn {
    padding: 10px 24px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .retry-btn:hover { background: var(--accent2); }

  .empty-season { color: var(--text-muted); font-size: 14px; padding: 20px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
  .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .no-results .icon { font-size: 48px; margin-bottom: 12px; }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--surface); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }
  html { scrollbar-color: var(--accent) var(--surface); scrollbar-width: thin; }

  /* ── 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; max-width: 280px; width: 88%;
    position: relative; text-align: center;
  }
  .modal-close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 22px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .modal-poster { width: 100%; border-radius: 10px; display: block; }
  .modal-loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 0; }
  .modal-title-text { font-size: 14px; font-weight: 700; margin-top: 14px; line-height: 1.4; word-break: keep-all; }
  .modal-score-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .modal-no-img { color: var(--text-muted); font-size: 13px; padding: 40px 0; }

  /* ══ 편집 모드 (로그인 시에만 노출 — 비로그인 화면엔 영향 없음) ══ */
  /* 편집 컨트롤은 .edit-on 클래스가 body에 있을 때만 보인다. */
  .edit-only { display: none; }
  body.edit-on .edit-only { display: inline-flex; }

  /* 우상단 로그인/편집 토글 버튼 — 또렷하게(가시성↑), 기존의 약 2배 크기 */
  .edit-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 90;
    background: var(--accent); border: 2px solid var(--accent2);
    color: #fff; border-radius: 10px; padding: 12px 24px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(124,106,240,0.4); transition: background 0.2s, transform 0.1s;
  }
  .edit-toggle:hover { background: var(--accent2); transform: translateY(-1px); }
  /* 로그인 후(편집 모드 ON): 종료 의미가 드러나게 차분한 색 */
  body.edit-on .edit-toggle { background: var(--surface2); color: var(--accent2); border-color: var(--accent); }

  /* 카드 위 수정/삭제 아이콘 */
  .card-edit-actions {
    position: absolute; top: 6px; right: 6px; z-index: 5;
    gap: 4px;
  }
  .card-edit-actions button {
    background: rgba(0,0,0,0.55); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; width: 26px; height: 26px;
    font-size: 13px; cursor: pointer; line-height: 1; padding: 0;
  }
  .card-edit-actions button:hover { background: var(--accent); border-color: var(--accent); }

  /* 분기 헤더의 편집 버튼들 */
  .season-edit-btn, .add-quarter-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 6px; padding: 4px 10px;
    font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .season-edit-btn:hover, .add-quarter-btn:hover { color: var(--text); border-color: var(--accent); }
  .add-quarter-bar { margin-bottom: 20px; }

  /* 편집 폼 모달 */
  .edit-modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; max-width: 420px; width: 92%;
    position: relative; max-height: 88vh; overflow-y: auto;
  }
  .edit-modal-box h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }
  .edit-field { margin-bottom: 12px; text-align: left; }
  .edit-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .edit-field input, .edit-field select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px; outline: none;
  }
  .edit-field input:focus, .edit-field select:focus { border-color: var(--accent); }
  .edit-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-primary {
    flex: 1; padding: 10px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    flex: 1; padding: 10px; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-danger { background: #b91c1c; }
  .btn-danger:hover { background: #dc2626; }
  .edit-msg { font-size: 12px; color: #f87171; margin-top: 10px; min-height: 16px; text-align: left; }
  .edit-warn { font-size: 13px; color: #fbbf24; margin: 8px 0 4px; line-height: 1.5; text-align: left; }

  /* 장르 자동완성 — 인라인 후보 목록(C9) */
  .genre-candidates { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .genre-cand-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
  .genre-cand-head button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; }
  .genre-cand-head button:hover { color: var(--text); }
  .genre-cand {
    display: flex; gap: 10px; align-items: center; text-align: left;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; cursor: pointer; transition: border-color 0.15s;
  }
  .genre-cand:hover { border-color: var(--accent); }
  .genre-cand img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; flex: 0 0 auto; background: var(--bg); }
  .genre-cand-info { min-width: 0; }
  .genre-cand-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .genre-cand-native { font-size: 11px; color: var(--text-muted); }
  .genre-cand-preview { font-size: 11px; color: var(--accent2); margin-top: 3px; }
  /* 직접 검색(P6) — 0건 시 노출되어 다른 표기로 재검색 */
  .direct-search { margin-top: 10px; padding: 10px; border: 1px dashed var(--accent); border-radius: 8px; background: rgba(124,106,240,0.06); }
  /* 후보 소스 배지(AniList/TMDB) */
  .cand-src { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 20px; margin-right: 4px; vertical-align: middle; }
  .cand-src.anilist { color: #a78bfa; background: rgba(167,139,250,0.15); }
  .cand-src.tmdb    { color: #4fc3f7; background: rgba(79,195,247,0.15); }

  /* 폼 포스터 미리보기 + URL 직접입력(P6) */
  .poster-preview { display: flex; gap: 10px; align-items: flex-start; margin-top: 6px; }
  .poster-preview img { width: 60px; height: 84px; object-fit: cover; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }

  /* 포스터 검수 갤러리(P5) */
  .review-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .review-progress { font-size: 13px; color: var(--text-muted); }
  .review-progress b { color: var(--accent2); }
  .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .review-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color 0.15s; position: relative;
  }
  .review-cell:hover { border-color: var(--accent); }
  .review-cell.no-poster { border-style: dashed; border-color: #b45309; }
  .review-cell img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--bg); }
  .review-cell .rc-empty { width: 100%; aspect-ratio: 2/3; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; background: var(--surface2); }
  .review-cell .rc-title { font-size: 11px; padding: 6px; line-height: 1.3; color: var(--text); word-break: keep-all; }

  /* TMDB attribution 푸터(C6) */
  .tmdb-attribution { text-align: center; padding: 24px 16px; color: var(--text-muted); font-size: 11px; line-height: 1.6; border-top: 1px solid var(--border); margin-top: 20px; }
  .tmdb-attribution img { height: 16px; vertical-align: middle; margin-right: 6px; opacity: 0.8; }
</style>
</head>
<body>

<header>
  <h1>🎌 나의 <span>애니</span> 감상 기록</h1>
  <div class="header-stats">
    <div class="stat"><div class="stat-num" id="total-count">-</div><div class="stat-label">총 시청 편수</div></div>
    <div class="stat"><div class="stat-num" id="avg-score">-</div><div class="stat-label">평균 점수</div></div>
    <div class="stat"><div class="stat-num" id="perfect-count">-</div><div class="stat-label">만점 (10점)</div></div>
    <div class="stat"><div class="stat-num" id="ongoing-count">-</div><div class="stat-label">시청 중</div></div>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="seasonal">분기별</div>
  <div class="tab" data-tab="classics">정주행</div>
  <div class="tab" data-tab="all">전체 보기</div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="search" placeholder="애니 제목 검색...">
  </div>
  <select id="sort">
    <option value="default">기본 순서</option>
    <option value="score-desc">점수 높은순</option>
    <option value="score-asc">점수 낮은순</option>
    <option value="title">제목순</option>
  </select>
  <select id="filter-score">
    <option value="all">전체 점수</option>
    <option value="10">10점</option>
    <option value="9">9점대</option>
    <option value="8">8점대</option>
    <option value="7">7점대</option>
    <option value="6">6점 이하</option>
    <option value="ongoing">시청 중</option>
  </select>
  <select id="filter-genre">
    <option value="all">전체 장르</option>
  </select>
  <div class="count-badge">표시 중: <span id="visible-count">-</span>편</div>
</div>

<main id="main">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">데이터 불러오는 중...</div>
  </div>
</main>

<!-- ══ TMDB attribution (무료 이용 의무 — 공식 문구, C6) ══ -->
<footer class="tmdb-attribution">
  <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB">
  This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-loading-wrap" class="modal-loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">포스터 불러오는 중...</div>
    </div>
    <img class="modal-poster" id="modal-poster" style="display:none" alt="포스터">
    <div class="modal-no-img" id="modal-no-img" style="display:none">포스터를 찾을 수 없어요 😥</div>
    <div class="modal-title-text" id="modal-title-text"></div>
    <div class="modal-score-text" id="modal-score-text"></div>
  </div>
</div>

<!-- ══ 편집 모드 토글 버튼 (우상단, 평소 흐릿) ══ -->
<button class="edit-toggle" id="edit-toggle">로그인</button>

<!-- ══ 편집 폼 모달 (로그인 / 작품 추가·수정 / 분기 추가 / 삭제 확인 공용) ══ -->
<div class="modal-overlay hidden" id="edit-overlay">
  <div class="edit-modal-box">
    <button class="modal-close" id="edit-close">✕</button>

// ── 분기 순서 fallback (quarters에 없는 비표준 분기명 대비 — §5-1b) ──
// 1차 정렬은 quarters의 year/season DESC. 아래는 보조 fallback일 뿐.
const QUARTER_ORDER = [
  '26년 2분기','26년 1분기',
  '25년 4분기','25년 3분기','25년 2분기','25년 1분기',
  '24년 4분기','24년 3분기','24년 2분기','24년 1분기',
  '23년 4분기','23년 3분기','23년 2분기','23년 1분기',
  '22년 4분기','22년 3분기','22년 2분기',
];

// ── 분기 문자열 → {year, season} 파싱 (마이그레이션 스크립트와 동일 규칙) ──
function parseQuarter(quarterStr) {
  const s = String(quarterStr ?? '').trim();
  const m = s.match(/(\d+)\s*년\s*(\d+)\s*분기/);
  if (!m) return { year: null, season: null };
  let year = parseInt(m[1], 10);
  const season = parseInt(m[2], 10);
  if (year < 100) year += 2000;
  if (season < 1 || season > 4) return { year, season: null };
  return { year, season };
}

// ── DB rows → DATA 구조 변환 (분기 순서·빈 분기는 quarters 기준 — §5-1a/D4) ──
// animeRows : anime 테이블 행(type/quarter/year/season 포함)
// quarterRows: quarters 테이블 행(quarter/year/season). 빈 분기 보존의 진실원천.
function buildDataFromRows(animeRows, quarterRows) {
  const seasonalMap = {};   // quarter → [anime...]
  const classics = [];

  animeRows.forEach(row => {
    const anime = { id: row.id, title: row.title };
    anime.score = (row.score === null || row.score === '' || row.score === undefined)
      ? null : parseFloat(row.score);
    if (row.note)   anime.note   = row.note;
    if (row.genre)  anime.genre  = row.genre;
    if (row.poster_url) anime.poster_url = row.poster_url;

    if (row.type === 'seasonal') {
      const q = row.quarter || '(미지정)';
      anime.quarter = row.quarter || null;   // 편집 폼 분기 기본값용(makeCard는 미사용 → 렌더 영향 없음)
      (seasonalMap[q] ||= []).push(anime);
    } else {
      classics.push(anime);
    }
  });

  // 분기 순서 = quarters 테이블(year/season DESC). 빈 분기도 여기 있으면 헤더 등장.
  // quarters에 없는데 anime에만 있는 분기는 뒤에 fallback 삽입(데이터 불일치 방어).
  const quarterList = (quarterRows || []).map(q => ({
    quarter: q.quarter,
    year: (q.year ?? parseQuarter(q.quarter).year),
    season: (q.season ?? parseQuarter(q.quarter).season),
  }));
  const quarterSet = new Set(quarterList.map(q => q.quarter));

  // anime엔 있는데 quarters에 없는 분기 → year/season 파싱해 fallback 추가
  Object.keys(seasonalMap).forEach(q => {
    if (q !== '(미지정)' && !quarterSet.has(q)) {
      const p = parseQuarter(q);
      quarterList.push({ quarter: q, year: p.year, season: p.season });
      quarterSet.add(q);
    }
  });

  // year/season DESC 정렬 (NULL은 맨 앞 — 기존 unknownNew가 맨 앞이던 동작과 일치, §5-1b)
  quarterList.sort((a, b) => {
    const ay = a.year, by = b.year;
    if (ay === null && by !== null) return -1;     // NULLS FIRST
    if (by === null && ay !== null) return 1;
    if (ay !== by) return (by ?? 0) - (ay ?? 0);
    const as = a.season, bs = b.season;
    if (as === null && bs !== null) return -1;
    if (bs === null && as !== null) return 1;
    return (bs ?? 0) - (as ?? 0);
  });

  return {
    seasonal: quarterList.map(q => ({
      quarter: q.quarter,
      anime: seasonalMap[q.quarter] || [],   // 작품 0개면 빈 배열 → 빈 분기 헤더(makeSection)
    })),
    classics,
    quarters: quarterList,                   // 편집 UI(분기 추가/삭제)에서 재사용
  };
}

// ── 유틸 ─────────────────────────────────────────────────
function scoreClass(s) {
  if (s === null) return 's-null';
  if (s >= 9)  return 'diamond';
  if (s >= 8)  return 'platinum';
  if (s >= 7)  return 'gold';
  if (s >= 5)  return 'silver';
  return 'bronze';
}

function stars(s) {
  if (s === null) return '';
  const f = Math.round(s / 2);
  return Array.from({length:5}, (_,i) => `<span class="star">${i<f?'★':'☆'}</span>`).join('');
}

function avgScore(list) {
  const rated = list.filter(a => a.score !== null);
  if (!rated.length) return null;
  return (rated.reduce((s,a) => s+a.score, 0) / rated.length).toFixed(1);
}

function avgStyle(avg) {
  if (!avg) return '';
  const n = parseFloat(avg);
  if (n >= 9) return 'color:var(--diamond);background:rgba(79,195,247,0.1)';
  if (n >= 8) return 'color:var(--platinum);background:rgba(38,166,154,0.1)';
  if (n >= 7) return 'color:var(--gold);background:rgba(200,162,52,0.1)';
  return 'color:var(--silver);background:rgba(158,158,176,0.1)';
}

function makeCard(a) {
  const sc = scoreClass(a.score);
  return `<div class="card ${sc}" data-id="${a.id ?? ''}" data-title="${a.title.replace(/"/g,'&quot;')}" data-score="${a.score ?? ''}" style="cursor:pointer">
    <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:${a.genre?'4px':'0'}">
      ${a.genre  ? `<span class="genre-badge">${a.genre}</span>`  : ''}
    </div>
    <div class="card-title">${a.title}</div>
    ${a.note ? `<div class="card-note">※ ${a.note}</div>` : ''}
    <div class="card-score">
      ${a.score !== null
        ? `<div><div style="display:flex;align-items:baseline;gap:3px">
             <span class="score-num">${a.score}</span>
             <span class="score-max">/ 10</span></div>
           <div class="stars">${stars(a.score)}</div></div>`
        : `<span class="ongoing-badge">▶ 시청 중</span>`}
    </div>
  </div>`;
}

function makeSection(quarter, list) {
  if (!list.length) {
    return `<div class="season-section">
      <div class="season-header">
        <div class="season-title">${quarter}</div>
        <div class="divider"></div>
      </div>
      <div class="empty-season">아직 기록 없음</div>
    </div>`;
  }
  const avg = avgScore(list);
  return `<div class="season-section">
    <div class="season-header">
      <div class="season-title">${quarter}</div>
      <div class="season-meta">
        <span class="season-count">${list.length}편</span>
        ${avg ? `<span class="season-avg" style="${avgStyle(avg)}">평균 ${avg}</span>` : ''}
      </div>
      <div class="divider"></div>
    </div>
    <div class="card-grid">${list.map(makeCard).join('')}</div>
  </div>`;
}

// ── 상태 ─────────────────────────────────────────────────
let DATA = null;
let POSTERS = {};   // build-posters.js로 생성된 사전 수집 포스터 맵
let currentTab = 'seasonal';
let searchQ = '', sortMode = 'default', scoreFilter = 'all', genreFilter = 'all';

function calcStats() {
  const all = [...DATA.seasonal.flatMap(s=>s.anime), ...DATA.classics];
  const rated = all.filter(a => a.score !== null);
  document.getElementById('total-count').textContent = rated.length;
  document.getElementById('avg-score').textContent =
    (rated.reduce((s,a)=>s+a.score,0)/rated.length).toFixed(1);
  document.getElementById('perfect-count').textContent = all.filter(a=>a.score===10).length;
  document.getElementById('ongoing-count').textContent = all.filter(a=>a.score===null).length;
}

function applyFilter(list) {
  let r = [...list];
  if (searchQ) r = r.filter(a => a.title.toLowerCase().includes(searchQ.toLowerCase()));
  if (scoreFilter === 'ongoing') r = r.filter(a => a.score===null);
  else if (scoreFilter === '10') r = r.filter(a => a.score===10);
  else if (scoreFilter === '9')  r = r.filter(a => a.score!==null && a.score>=9 && a.score<10);
  else if (scoreFilter === '8')  r = r.filter(a => a.score!==null && a.score>=8 && a.score<9);
  else if (scoreFilter === '7')  r = r.filter(a => a.score!==null && a.score>=7 && a.score<8);
  else if (scoreFilter === '6')  r = r.filter(a => a.score!==null && a.score<7);
  if (genreFilter !== 'all') r = r.filter(a => a.genre && a.genre.includes(genreFilter));
  if (sortMode==='score-desc') r.sort((a,b)=>(b.score??-1)-(a.score??-1));
  else if (sortMode==='score-asc') r.sort((a,b)=>(a.score??99)-(b.score??99));
  else if (sortMode==='title') r.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  return r;
}

function populateGenreFilter() {
  const all = [...DATA.seasonal.flatMap(s=>s.anime), ...DATA.classics];
  const genres = new Set();
  all.forEach(a => { if (a.genre) a.genre.split('/').forEach(g => genres.add(g.trim())); });
  const sel = document.getElementById('filter-genre');
  // 재호출(편집 후 재로드) 시 중복 방지 — "전체 장르"(첫 옵션)만 남기고 비움
  while (sel.options.length > 1) sel.remove(1);
  [...genres].sort().forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
}

function render() {
  if (!DATA) return;
  const main = document.getElementById('main');
  let total = 0, html = '';
  const noResult = `<div class="no-results"><div class="icon">🔍</div>검색 결과 없음</div>`;

  if (currentTab === 'seasonal') {
    DATA.seasonal.forEach(s => {
      const f = applyFilter(s.anime);
      total += f.length;
      if ((searchQ || scoreFilter!=='all') && !f.length) return;
      html += makeSection(s.quarter, (searchQ||scoreFilter!=='all') ? f : s.anime);
    });
  } else if (currentTab === 'classics') {
    const f = applyFilter(DATA.classics);
    total = f.length;
    html = f.length ? makeSection('정주행 목록', f) : noResult;
  } else {
    const all = [
      ...DATA.seasonal.flatMap(s => s.anime.map(a=>({...a,_q:s.quarter}))),
      ...DATA.classics.map(a=>({...a,_q:'정주행'}))
    ];
    const f = applyFilter(all);
    total = f.length;
    if (sortMode !== 'default') {
      html = f.length ? makeSection(`전체 (${f.length}편)`, f) : noResult;
    } else {
      const grp = {};
      f.forEach(a => { if(!grp[a._q]) grp[a._q]=[]; grp[a._q].push(a); });
      DATA.seasonal.forEach(s => { if(grp[s.quarter]) html+=makeSection(s.quarter,grp[s.quarter]); });
      if (grp['정주행']) html += makeSection('정주행', grp['정주행']);
      if (!html) html = noResult;
    }
  }

  main.innerHTML = html || noResult;
  document.getElementById('visible-count').textContent = total;

  // 편집 모드 ON일 때만 편집 컨트롤을 DOM에 후처리 주입(렌더 함수 자체는 불변).
  if (editMode) injectEditControls();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {

    t.classList.add('active');
    currentTab = t.dataset.tab;
    render();
  });
});

document.getElementById('sort').addEventListener('change', e => { sortMode=e.target.value; render(); });
document.getElementById('filter-score').addEventListener('change', e => { scoreFilter=e.target.value; render(); });
document.getElementById('filter-genre').addEventListener('change', e => { genreFilter=e.target.value; render(); });

// ── 데이터 로드 (Supabase select 2쿼리 병렬) ─────────────
async function loadData() {
  const main = document.getElementById('main');

  // posters.json 백그라운드 로드 (실패해도 무시)
  fetch('./posters.json')
    .then(r => r.ok ? r.json() : {})
    .then(data => { POSTERS = data || {}; })
    .catch(() => {});

  if (!SUPABASE_CONFIGURED) {
    main.innerHTML = `<div class="error-box">
      <div class="error-icon">⚙️</div>
      <div class="error-msg">Supabase 연결이 아직 설정되지 않았습니다.<br>설계/Supabase_셋업_가이드.md 절차에 따라<br>SUPABASE_URL / SUPABASE_ANON_KEY를 기입해주세요.</div>
    </div>`;
    return;
  }

  try {
    // anime(정렬 포함)와 quarters를 병렬 fetch
    const [animeRes, quartersRes] = await Promise.all([
      supabase.from('anime')
        .select('id,title,score,type,quarter,year,season,note,genre,poster_url,sort_order')
        .order('year', { ascending: false, nullsFirst: true })
        .order('season', { ascending: false, nullsFirst: true })
        .order('sort_order', { ascending: true })
        .order('id', { ascending: true }),
      supabase.from('quarters')
        .select('quarter,year,season')
        .order('year', { ascending: false })
        .order('season', { ascending: false }),
    ]);
    if (animeRes.error) throw animeRes.error;
    if (quartersRes.error) throw quartersRes.error;

    DATA = buildDataFromRows(animeRes.data || [], quartersRes.data || []);
    calcStats();
    populateGenreFilter();
    render();
  } catch (e) {
    main.innerHTML = `<div class="error-box">
      <div class="error-icon">⚠️</div>
      <div class="error-msg">데이터를 불러오지 못했습니다.<br>${e.message || e}</div>
      <button class="retry-btn" id="retry-btn">다시 시도</button>
    </div>`;
    const rb = document.getElementById('retry-btn');
    if (rb) rb.addEventListener('click', loadData);
  }
}

loadData();

async function fetchPoster(title) {
  const query = `query($s:String){Media(search:$s,type:ANIME){coverImage{large}}}`;
  // 축약·은어 → 실제 제목으로 변환
  title = TITLE_ALIAS[title] ?? title;

  async function searchAL(q) {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables: { s: q } })
    });
    const json = await res.json();
    return json.data?.Media?.coverImage?.large ?? null;
  }

  async function translate(q) {
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=ko|en`);
      const json = await res.json();
      return json.responseData?.translatedText ?? null;
    } catch { return null; }
  }

  function strip(t) {
    return t.replace(/\s*\d+기$|\s*\d+쿨$|\s*시즌\s*\d+$|\s*Part\s*\d+$/i, '').trim();
  }

  // 1단계: 원제목
  let url = await searchAL(title);
  if (url) return url;

  // 2단계: N기/N쿨 제거 후 재검색
  const stripped = strip(title);
  if (stripped !== title) {
    url = await searchAL(stripped);
    if (url) return url;
  }

  // 3단계: 영어 번역 후 재검색
  const en = await translate(stripped || title);
  if (en) url = await searchAL(en);

  return url;
}

// ════════════════════════════════════════════════════════════════════════
//  장르 자동완성 (AniList genres+tags → 한글 슬래시 표기로 정규화)
// ════════════════════════════════════════════════════════════════════════
//  매핑 우변은 anime_seed.csv 실측 34개 토큰 allowlist로만 한정(닫힌 집합 — G4).
//  CSV에 없는 토큰(메카·스릴러 등)은 매핑하지 않아 자동으로 버려진다.
//  실측(2026-07-01): AniList genres=문자열배열, tags={name,rank,isMediaSpoiler},
//  rate limit x-ratelimit-limit:30/분. 편집 1회성이라 여유. 429는 안내 처리.

// AniList 영어 genres → 한글(우변 전부 CSV 실측 토큰)
const GENRE_MAP = {
  'Action':'액션', 'Adventure':'모험', 'Comedy':'코미디', 'Drama':'드라마',
  'Romance':'로맨스', 'Sci-Fi':'SF', 'Fantasy':'판타지', 'Slice of Life':'일상',
  'Mystery':'미스터리', 'Supernatural':'오컬트', 'Sports':'스포츠', 'Music':'음악',
  'Psychological':'심리', 'Horror':'공포', 'Ecchi':'성인', 'Mahou Shoujo':'마법소녀',
  // Mecha·Thriller 등은 CSV 0건 → 의도적으로 매핑 안 함(버려짐)
};

// AniList 세분 tags → 한글(우변 전부 CSV 실측 토큰). rank로 신뢰도 필터.
const TAG_MAP = {
  'School':'학원', 'School Life':'학원', 'Isekai':'이세계', 'Harem':'하렘',
  'Idol':'아이돌', 'Zombie':'좀비', 'Super Power':'초능력', 'Superpower':'초능력',
  'Magic':'마법', 'Video Games':'게임', 'Gaming':'게임', 'Historical':'역사',
  'Gambling':'도박', 'Family Life':'가족', 'Found Family':'가족', 'Parenthood':'가족',
  'Espionage':'스파이', 'Cosplay':'코스프레', 'Idols (Female)':'아이돌', 'Idols (Male)':'아이돌',
  'Boxing':'격투', 'Martial Arts':'격투', 'Economics':'경제', 'Coming of Age':'청춘',
  'Work':'직장', 'Workplace':'직장', 'Occult':'오컬트', 'Heroes':'히어로', 'Super Robot':'히어로',
  'Sports':'스포츠', 'Idol':'아이돌',
};

// 앱에서 흔한 순서(가중 정렬용) — 앞일수록 우선 노출
const GENRE_WEIGHT = ['로맨스','코미디','학원','판타지','액션','드라마','심리','SF','일상',
  '이세계','하렘','미스터리','공포','스포츠','음악','모험','초능력','마법',
  '게임','역사','아이돌','스파이','도박','가족','오컬트','히어로','마법소녀','성인',
  '코스프레','격투','경제','청춘','직장','좀비'];

// CSV 실측 allowlist(우변 검증용) — 이 집합 밖 토큰은 결과에서 제외
const GENRE_ALLOWLIST = new Set(Object.values(GENRE_MAP).concat(Object.values(TAG_MAP)));

const TAG_RANK_MIN = 60;   // tag 신뢰도 임계값(C1 추천)
const GENRE_MAX = 5;        // 최대 장르 개수(C1 추천 4~5)

// genres(영) + tags(영,rank) → 한글 슬래시 표기로 정규화
function mapGenres(genres, tags) {
  const out = [];
  const seen = new Set();
  const add = (ko) => { if (ko && GENRE_ALLOWLIST.has(ko) && !seen.has(ko)) { seen.add(ko); out.push(ko); } };

  (genres || []).forEach(g => add(GENRE_MAP[g]));
  (tags || [])
    .filter(t => t.rank >= TAG_RANK_MIN && !t.isMediaSpoiler)
    .sort((a, b) => b.rank - a.rank)
    .forEach(t => add(TAG_MAP[t.name]));

  // 앱 흔한 순서 가중 정렬 → 상위 GENRE_MAX개
  out.sort((a, b) => {
    const ia = GENRE_WEIGHT.indexOf(a), ib = GENRE_WEIGHT.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  return out.slice(0, GENRE_MAX).join('/');
}

// "N기/N쿨/시즌N/PartN" 접미어 제거(원제와 함께 검색해 기수 제목 매칭률↑)
const stripSeason = (t) => t.replace(/\s*\d+기$|\s*\d+쿨$|\s*시즌\s*\d+$|\s*Part\s*\d+$/i, '').trim();

// ── AniList 후보 조회 → raw media[] ─────────────────────────────────────
// 입력 전략: 원제 + strip제목을 "둘 다" 검색해 합침(기수 제목이 원제에서 안 잡혀도 strip으로 보강).
// 그래도 0건이면 mymemory 번역(ko→en) 후 재검색.
async function fetchAnilistCandidates(queries) {
  const query = `query($s:String){Page(perPage:8){media(search:$s,type:ANIME,sort:SEARCH_MATCH){id title{romaji english native} coverImage{medium large} genres tags{name rank isMediaSpoiler}}}}`;

  async function searchAL(q) {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables: { s: q } })
    });
    if (res.status === 429) throw new Error('AniList 요청 한도 초과(429) — 잠시 후 다시 시도');
    const json = await res.json();
    return json.data?.Page?.media || [];
  }
  async function translate(q) {
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=ko|en`);
      const json = await res.json();
      return json.responseData?.translatedText ?? null;
    } catch { return null; }
  }

  // 원제 + strip제목 각각 검색해 합침(id 중복제거)
  const seen = new Set();
  let media = [];
  for (const q of queries) {
    const list = await searchAL(q);
    for (const m of list) { if (!seen.has(m.id)) { seen.add(m.id); media.push(m); } }
  }
  // 전부 0건이면 번역 fallback(1회)
  if (media.length === 0) {
    const en = await translate(queries[queries.length - 1] || queries[0]);
    if (en) media = await searchAL(en);
  }
  return media;
}

// ── TMDB 후보 조회 (search/tv?ko-KR → 0건이면 search/movie, C7) → raw results[] ──
// 원제 + strip제목 둘 다 tv 검색해 합침. 전부 0건이면 각 쿼리로 movie 검색.
async function fetchTmdbCandidates(queries) {
  if (!TMDB_CONFIGURED) return [];   // key 미설정 → 스킵(graceful, C5/P7)
  async function search(kind, q) {
    const url = `https://api.themoviedb.org/3/search/${kind}?query=${encodeURIComponent(q)}&language=ko-KR&api_key=${TMDB_API_KEY}`;
    const res = await fetch(url);
    if (res.status === 429) throw new Error('TMDB 요청 한도 초과(429) — 잠시 후 다시 시도');
    if (!res.ok) return [];
    const json = await res.json();
    return (json.results || []).map(r => ({ ...r, _kind: kind }));
  }
  async function searchAll(kind) {
    const seen = new Set();
    const out = [];
    for (const q of queries) {
      const list = await search(kind, q);
      for (const r of list) { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); } }
    }
    return out;
  }
  let results = await searchAll('tv');                     // tv 우선(원제+strip)
  if (results.length === 0) results = await searchAll('movie'); // 전부 0건이면 movie(C7)
  return results;
}

// ── 통일 Candidate 정규화 (§5-3) — 소스 무관하게 렌더/선택 ──────────────
function normalizeAnilist(m) {
  const main = m.title?.romaji || m.title?.english || m.title?.native || '(제목 없음)';
  const sub = m.title?.native && m.title.native !== main ? m.title.native : (m.title?.english && m.title.english !== main ? m.title.english : '');
  return {
    source: 'anilist', id: m.id,
    titleMain: main, titleSub: sub,
    posterUrl: m.coverImage?.large || m.coverImage?.medium || '',
    thumbUrl: m.coverImage?.medium || m.coverImage?.large || '',
    genres: m.genres || [], tags: m.tags || [],
  };
}
function normalizeTmdb(r) {
  const main = r.name || r.title || r.original_name || r.original_title || '(제목 없음)';
  const sub = r.original_name || r.original_title || '';
  const poster = r.poster_path ? TMDB_IMG + 'w500' + r.poster_path : '';
  const thumb  = r.poster_path ? TMDB_IMG + 'w185' + r.poster_path : '';
  return {
    source: 'tmdb', id: r.id,
    tvId: r._kind === 'tv' ? r.id : null,   // tv면 /tv/{id} 시즌 조회용(movie는 시즌 없음)
    titleMain: main, titleSub: (sub && sub !== main ? sub : ''),
    posterUrl: poster, thumbUrl: thumb,
    genres: [], tags: [],   // TMDB엔 앱 장르 매핑 소스 없음 → 포스터만(C1)
  };
}

// TMDB tv 시즌 포스터 조회 (/tv/{id}) → [{label, name, posterUrl}] (본작 + season 1..N, 최대 6 — C10)
async function fetchSeasonPosters(tvId, mainPosterUrl) {
  const out = [];
  if (mainPosterUrl) out.push({ label: '본작', name: '', posterUrl: mainPosterUrl });
  try {
    const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?language=ko-KR&api_key=${TMDB_API_KEY}`);
    if (!res.ok) return out;
    const json = await res.json();
    (json.seasons || [])
      .filter(s => s.season_number >= 1 && s.poster_path)
      .slice(0, 6)   // 최대 6시즌(C10)
      .forEach(s => out.push({
        label: `시즌 ${s.season_number}`, name: s.name || '',
        posterUrl: TMDB_IMG + 'w500' + s.poster_path,
      }));
  } catch { /* 시즌 조회 실패 → 본작만 */ }
  return out;
}

// 제목 → 검색어 변형 세트(공백에 민감한 TMDB/AniList 대비). 서로 다른 것만, 빈값 제외.
// 원제 / 기수 제거 / 공백 정규화 / 공백 완전 제거. (공백 삽입은 자동 불가 → 직접검색 대안)
function queryVariants(base) {
  const norm = (s) => s.replace(/\s+/g, ' ').trim();   // 연속 공백 → 단일
  const nospace = (s) => s.replace(/\s+/g, '');         // 공백 완전 제거
  const stripped = stripSeason(base);
  const variants = [
    base,
    norm(base),
    nospace(base),
    stripped,
    norm(stripped),
    nospace(stripped),
  ];
  return [...new Set(variants.filter(v => v && v.trim()))];  // 중복·빈값 제거
}

// 제목 → AniList + TMDB 병합 Candidate 배열 (정렬 TMDB 먼저 — C2, source+id 중복제거)
async function fetchGenreCandidates(title) {
  // 검색어 = 원제/기수제거/공백정규화/공백제거 변형 세트. 중복 스킵.
  const aliased = TITLE_ALIAS[title] ?? title;
  const alQueries = queryVariants(aliased);   // AniList: 별칭 적용
  const tmdbQueries = queryVariants(title);   // TMDB: 원제 그대로(ko-KR 유리)

  // 두 소스 병렬 조회(한쪽 실패해도 다른 쪽 살림)
  const [alRes, tmdbRes] = await Promise.allSettled([
    fetchAnilistCandidates(alQueries),
    fetchTmdbCandidates(tmdbQueries),
  ]);
  const alCands = alRes.status === 'fulfilled' ? alRes.value.map(normalizeAnilist) : [];
  const tmdbCands = tmdbRes.status === 'fulfilled' ? tmdbRes.value.map(normalizeTmdb) : [];

  // 정렬: TMDB 먼저 → AniList (C2). source+id로 중복제거
  const merged = [...tmdbCands, ...alCands];
  const seen = new Set();
  const out = merged.filter(c => {
    const key = c.source + ':' + c.id;
    return seen.has(key) ? false : (seen.add(key), true);
  });

  // 두 소스 다 실패(에러)면 예외 전파 — runCandidateSearch가 안내
  if (alRes.status === 'rejected' && tmdbRes.status === 'rejected') {
    throw alRes.reason || tmdbRes.reason || new Error('후보 검색 실패');
  }
  return out;
}

document.getElementById('main').addEventListener('click', async e => {
  const card = e.target.closest('[data-title]');
  if (!card) return;
  const title    = card.dataset.title;
  const scoreRaw = card.dataset.score;
  const score    = scoreRaw === '' ? null : parseFloat(scoreRaw);
  openModal(title, score);
  try {
    // 표시 우선순위(P3): poster_url(DB, 있으면 즉시·라이브호출0) → posters.json → 라이브검색
    // D1: findAnimeById로 DATA 조회(makeCard DOM 속성 추가 없이 — XSS 표면 0)
    let url = findAnimeById(card.dataset.id)?.poster_url || null;
    // 1. DB에 없으면 사전 수집 맵(posters.json)
    if (!url) url = POSTERS[title] ?? null;
    // 2. 맵에도 없으면 라이브 API fallback
    if (!url) url = await fetchPoster(title);
    modalLoadWrap.style.display = 'none';
    if (url) {
      modalPoster.onload = () => { modalPoster.style.display = 'block'; };
      modalPoster.onerror = () => { modalNoImg.style.display = 'block'; };
      modalPoster.src = url;
    } else {
      modalNoImg.style.display = 'block';
    }
  } catch {
    modalLoadWrap.style.display = 'none';
    modalNoImg.style.display    = 'block';
  }
});

//  ⚠️ 보안 한계 명시: 아래 편집 토글/폼 노출은 'UX 가림막'일 뿐 진짜 보안이
//     아니다. 공개 사이트라 anon key·로직은 누구나 소스에서 볼 수 있다.
//     실제 쓰기 차단은 Supabase RLS(auth.uid()=관리자) 가 담당한다.
//     → 로그인 안 한 사람이 콘솔에서 insert/update/delete 시도해도 RLS가 거부.
// ════════════════════════════════════════════════════════════════════════

let editMode = false;           // 편집 컨트롤 노출 여부(= 로그인 성공 상태)
let posterReviewOpen = false;   // 포스터 검수 갤러리 열림 여부(편집모드 전용)
const editOverlay = document.getElementById('edit-overlay');
const editContent = document.getElementById('edit-modal-content');
const editToggleBtn = document.getElementById('edit-toggle');

function openEditModal(html) {
  editContent.innerHTML = html;
  editOverlay.classList.remove('hidden');
}
function closeEditModal() {
  editOverlay.classList.add('hidden');
  editContent.innerHTML = '';
}
document.getElementById('edit-close').addEventListener('click', closeEditModal);
editOverlay.addEventListener('click', e => { if (e.target === editOverlay) closeEditModal(); });

// HTML 이스케이프(폼 value 주입 시 XSS·따옴표 깨짐 방지)
function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 로그인 상태 전환 ─────────────────────────────────────
function setEditMode(on) {
  editMode = on;
  document.body.classList.toggle('edit-on', on);
  editToggleBtn.textContent = on ? '로그아웃' : '로그인';
  if (!on) posterReviewOpen = false;   // 로그아웃 시 검수 뷰 강제 종료(방문자 노출 방지)
  render();   // 편집 컨트롤 주입/제거 반영
}

// 세션 복원: 이미 로그인돼 있으면 편집 모드 자동 ON
async function initAuth() {
  if (!SUPABASE_CONFIGURED) return;
  const { data } = await supabase.auth.getSession();
  if (data?.session) setEditMode(true);
}

// ── 편집 토글 클릭: 로그인 폼 or 로그아웃 ─────────────────
editToggleBtn.addEventListener('click', async () => {
  if (!SUPABASE_CONFIGURED) {
    alert('Supabase가 아직 설정되지 않았습니다. (셋업 가이드 참조)');
    return;
  }
  if (editMode) {
    // 편집 종료 = 로그아웃
    await supabase.auth.signOut();
    setEditMode(false);
    return;
  }
  // 로그인 폼
  openEditModal(`
    <h3>관리자 로그인</h3>
    <div class="edit-field"><label>이메일</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="edit-field"><label>비밀번호</label>
      <input type="password" id="login-pw" autocomplete="current-password"></div>
    <div class="edit-msg" id="login-msg"></div>
    <div class="edit-actions">
      <button class="btn-secondary" id="login-cancel">취소</button>
      <button class="btn-primary" id="login-submit">로그인</button>
    </div>`);
  document.getElementById('login-cancel').addEventListener('click', closeEditModal);
  document.getElementById('login-submit').addEventListener('click', doLogin);
  document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('login-submit');
  msg.textContent = '';
  if (!email || !pw) { msg.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  btn.disabled = true; btn.textContent = '로그인 중...';
  const { error } = await supabase.auth.signInWithPassword({ email, password: pw });
  btn.disabled = false; btn.textContent = '로그인';
  if (error) { msg.textContent = '로그인 실패: ' + error.message; return; }
  closeEditModal();
  setEditMode(true);
}

// ── DB에서 id로 anime 행 찾기 (현재 DATA 캐시 기준) ──────
function findAnimeById(id) {
  const all = [...DATA.seasonal.flatMap(s => s.anime), ...DATA.classics];
  return all.find(a => String(a.id) === String(id));
}

// ── CRUD 후 공통: 재로드 → 통계/장르/렌더 갱신 ───────────
async function reloadData() {
  const [animeRes, quartersRes] = await Promise.all([
    supabase.from('anime')
      .select('id,title,score,type,quarter,year,season,note,genre,poster_url,sort_order')
      .order('year', { ascending: false, nullsFirst: true })
      .order('season', { ascending: false, nullsFirst: true })
      .order('sort_order', { ascending: true })
      .order('id', { ascending: true }),
    supabase.from('quarters')
      .select('quarter,year,season')
      .order('year', { ascending: false })
      .order('season', { ascending: false }),
  ]);
  if (animeRes.error) throw animeRes.error;
  if (quartersRes.error) throw quartersRes.error;
  DATA = buildDataFromRows(animeRes.data || [], quartersRes.data || []);
  calcStats();
  populateGenreFilter();
  // 검수 갤러리가 열려 있으면 그리드 갱신(P5 즉시 반영), 아니면 일반 렌더
  if (posterReviewOpen) openPosterReview();
  else render();
}

// ════════════════════════════════════════════════════════════════════════
//  편집 컨트롤 DOM 후처리 주입 (makeCard/makeSection 함수는 불변)
// ════════════════════════════════════════════════════════════════════════
function injectEditControls() {
  const main = document.getElementById('main');

  // 1) 각 카드에 ✎/🗑 버튼 주입
  main.querySelectorAll('.card[data-id]').forEach(card => {
    if (card.querySelector('.card-edit-actions')) return;   // 중복 방지
    const id = card.dataset.id;
    if (!id) return;
    const bar = document.createElement('div');
    bar.className = 'card-edit-actions edit-only';
    bar.style.display = 'inline-flex';
    bar.innerHTML = `<button data-act="edit" data-id="${esc(id)}" title="수정">✎</button>
                     <button data-act="del" data-id="${esc(id)}" title="삭제">🗑</button>`;
    card.appendChild(bar);
  });

  // 2) 각 분기 섹션 헤더에 "작품 추가" / "분기 삭제" 버튼 주입 (seasonal 탭만)
  if (currentTab === 'seasonal') {
    main.querySelectorAll('.season-section').forEach(section => {
      const titleEl = section.querySelector('.season-title');
      if (!titleEl) return;
      const quarter = titleEl.textContent.trim();
      const header = section.querySelector('.season-header');
      if (!header || header.querySelector('.season-edit-btn')) return;
      // 분기명이 실제 quarters 목록에 있는 것만 편집 버튼 부여(전체보기 합산 헤더 등 제외)
      const isRealQuarter = DATA.quarters && DATA.quarters.some(q => q.quarter === quarter);
      if (!isRealQuarter) return;
      const meta = document.createElement('div');
      meta.className = 'season-meta edit-only';
      meta.style.display = 'inline-flex';
      meta.style.gap = '6px';
      meta.innerHTML = `<button class="season-edit-btn" data-act="add-anime" data-quarter="${esc(quarter)}">+ 작품 추가</button>
                        <button class="season-edit-btn" data-act="del-quarter" data-quarter="${esc(quarter)}">분기 삭제</button>`;
      const divider = header.querySelector('.divider');
      header.insertBefore(meta, divider);
    });
  }

  // 3) seasonal/classics 탭 상단에 "+ 새 분기 추가" / "+ 정주행 작품 추가" + "포스터 검수" 바
  if ((currentTab === 'seasonal' || currentTab === 'classics') && !main.querySelector('.add-quarter-bar')) {
    const bar = document.createElement('div');
    bar.className = 'add-quarter-bar edit-only';
    bar.style.display = 'block';
    const addBtn = currentTab === 'seasonal'
      ? `<button class="add-quarter-btn" data-act="add-quarter">+ 새 분기 추가</button>`
      : `<button class="add-quarter-btn" data-act="add-classic">+ 정주행 작품 추가</button>`;
    // 포스터 검수 갤러리 진입(C4 — 편집모드 전용 버튼)
    bar.innerHTML = `${addBtn} <button class="add-quarter-btn" data-act="review-posters">🖼 포스터 검수</button>`;
    main.insertBefore(bar, main.firstChild);
  }
}

// ── 편집 컨트롤 클릭 위임 (main 영역) ────────────────────
document.getElementById('main').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn || !editMode) return;
  e.stopPropagation();          // 포스터 모달 핸들러로 전파 차단
  e.preventDefault();
  const act = btn.dataset.act;
  if (act === 'edit')         openAnimeForm(findAnimeById(btn.dataset.id));
  else if (act === 'del')     confirmDeleteAnime(findAnimeById(btn.dataset.id));
  else if (act === 'add-anime')   openAnimeForm(null, { type: 'seasonal', quarter: btn.dataset.quarter });
  else if (act === 'add-classic') openAnimeForm(null, { type: 'classic' });
  else if (act === 'add-quarter') openQuarterForm();
  else if (act === 'del-quarter') confirmDeleteQuarter(btn.dataset.quarter);
  else if (act === 'review-posters') openPosterReview();
}, true);   // 캡처 단계 — 포스터 모달 핸들러(버블)보다 먼저 가로채 stopPropagation

// ════════════════════════════════════════════════════════════════════════
//  작품 추가/수정 폼 (seasonal·classic 공용)
// ════════════════════════════════════════════════════════════════════════
function openAnimeForm(anime, preset) {
  const isEdit = !!anime;
  const a = anime || {};
  const type = isEdit ? (DATA.classics.includes(a) ? 'classic' : 'seasonal')
                      : (preset?.type || 'seasonal');
  const presetQuarter = preset?.quarter || a.quarter || '';

  // seasonal이면 분기 선택 드롭다운(quarters 목록), classic이면 분기 없음
  const quarterOptions = (DATA.quarters || [])
    .map(q => `<option value="${esc(q.quarter)}" ${q.quarter === presetQuarter ? 'selected' : ''}>${esc(q.quarter)}</option>`)
    .join('');

  openEditModal(`
    <h3>${isEdit ? '작품 수정' : (type === 'classic' ? '정주행 작품 추가' : '작품 추가')}</h3>
    <div class="edit-field"><label>제목 *</label>
      <input type="text" id="f-title" value="${esc(a.title || '')}"></div>
    <div class="edit-field"><label>점수 (0~10, 비우면 '시청 중')</label>
      <input type="number" id="f-score" step="0.1" min="0" max="10" value="${a.score ?? ''}"></div>
    ${type === 'seasonal' ? `
    <div class="edit-field"><label>분기 *</label>
      <select id="f-quarter">${quarterOptions || '<option value="">(분기를 먼저 추가하세요)</option>'}</select></div>` : ''}
    <div class="edit-field"><label>노트 (선택)</label>
      <input type="text" id="f-note" value="${esc(a.note || '')}"></div>
    <div class="edit-field"><label>장르 (슬래시 구분, 예: 로맨스/코미디)</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="f-genre" value="${esc(a.genre || '')}" style="flex:1">
        <button type="button" class="btn-secondary" id="f-genre-auto" style="flex:0 0 auto;white-space:nowrap;padding:9px 14px">장르 자동</button>
      </div>
      <div class="genre-candidates" id="genre-candidates" style="display:none"></div>
      <div class="direct-search" id="direct-search" style="display:none">
        <label style="font-size:11px;color:var(--text-muted)">직접 검색 — 다른 표기(띄어쓰기·영어·일본어)로 다시 찾기</label>
        <div style="display:flex;gap:8px;margin-top:4px">
          <input type="text" id="f-search" placeholder="예: 윈드 브레이커 / Wind Breaker" style="flex:1">
          <button type="button" class="btn-secondary" id="f-search-btn" style="flex:0 0 auto;white-space:nowrap;padding:9px 14px">검색</button>
        </div>
      </div></div>
    <div class="edit-field"><label>포스터 URL (선택 — 후보 선택 시 자동, 직접 입력·수정 가능)</label>
      <input type="text" id="f-poster" value="${esc(a.poster_url || '')}">
      <div class="poster-preview">
        <img id="f-poster-preview" alt="포스터 미리보기"
             src="${esc(a.poster_url || '')}" style="display:${a.poster_url ? 'block' : 'none'}">
      </div></div>
    <div class="edit-msg" id="f-msg"></div>
    <div class="edit-actions">
      <button class="btn-secondary" id="f-cancel">취소</button>
      <button class="btn-primary" id="f-save">저장</button>
    </div>`);

  document.getElementById('f-cancel').addEventListener('click', closeEditModal);
  document.getElementById('f-save').addEventListener('click', () => saveAnimeForm(isEdit ? a.id : null, type));
  document.getElementById('f-genre-auto').addEventListener('click', () => runCandidateSearch());
  // 포스터 URL 직접 수정 시 미리보기 갱신(P6)
  document.getElementById('f-poster').addEventListener('input', e => setPosterField(e.target.value.trim()));
  // 직접 검색(P6): f-search 값으로 후보 재검색
  const searchBtn = document.getElementById('f-search-btn');
  const searchInput = document.getElementById('f-search');
  searchBtn.addEventListener('click', () => runCandidateSearch(searchInput.value.trim()));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runCandidateSearch(searchInput.value.trim()); } });
}

// 현재 후보 데이터 캐시(클릭 시 추가 fetch 없이 재사용 — GR6)
let genreCandidateCache = [];
let seasonCandidateCache = [];   // 시즌 서브후보 캐시

// 후보 검색 실행 — '장르 자동'(제목 사용) 또는 '직접 검색'(query 인자) 공용
// query 미지정 시 제목(f-title) 사용. 공백·기수 변형 세트로 검색(fetchGenreCandidates).
async function runCandidateSearch(query) {
  const msg = document.getElementById('f-msg');
  const btn = query != null ? document.getElementById('f-search-btn') : document.getElementById('f-genre-auto');
  const box = document.getElementById('genre-candidates');
  const directSearch = document.getElementById('direct-search');
  const term = (query != null ? query : document.getElementById('f-title').value).trim();
  msg.textContent = '';
  if (!term) {
    msg.textContent = query != null ? '검색어를 입력하세요.' : '제목을 먼저 입력하세요.';
    return;
  }

  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '조회 중...';
  try {
    const media = await fetchGenreCandidates(term);
    genreCandidateCache = media;
    if (media.length === 0) {
      box.style.display = 'none';
      // 0건 안내 강화 + 직접 검색창 노출·포커스(P6)
      msg.textContent = "검색 결과 없음 — 아래 '직접 검색' 칸에 다른 표기(띄어쓰기·영어·일본어)로 입력해 보세요.";
      directSearch.style.display = 'block';
      document.getElementById('f-search').focus();
    } else {
      renderGenreCandidates(media);
    }
  } catch (e) {
    box.style.display = 'none';
    msg.textContent = (e.message || '검색 실패') + " — 아래 '직접 검색' 칸에 다른 표기로 시도하세요.";
    directSearch.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

// 후보 목록 렌더(C9 인라인) — Candidate 스키마 기반. 소스 배지 + 장르/포스터 미리보기(C10)
function renderGenreCandidates(cands) {
  const box = document.getElementById('genre-candidates');
  const cards = cands.map((c, i) => {
    const preview = c.source === 'tmdb'
      ? '(TMDB — 포스터만, 장르 없음)'
      : (mapGenres(c.genres, c.tags) || '(매핑 장르 없음)');
    const badge = `<span class="cand-src ${c.source}">${c.source === 'tmdb' ? 'TMDB' : 'AniList'}</span>`;
    return `<div class="genre-cand" data-idx="${i}">
      ${c.thumbUrl ? `<img src="${esc(c.thumbUrl)}" alt="" loading="lazy">` : '<div style="width:40px;height:56px;flex:0 0 auto"></div>'}
      <div class="genre-cand-info">
        <div class="genre-cand-title">${badge}${esc(c.titleMain)}</div>
        ${c.titleSub ? `<div class="genre-cand-native">${esc(c.titleSub)}</div>` : ''}
        <div class="genre-cand-preview">${esc(preview)}</div>
      </div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="genre-cand-head"><span>맞는 작품을 선택하세요 (${cands.length})</span>
      <button type="button" id="genre-cand-close">닫기</button></div>${cards}`;
  box.style.display = 'flex';

  document.getElementById('genre-cand-close').addEventListener('click', closeGenreCandidates);
  box.querySelectorAll('.genre-cand').forEach(el => {
    el.addEventListener('click', () => pickGenreCandidate(+el.dataset.idx));
  });
}

// 후보 클릭 → 장르 매핑(AniList) + 포스터 확정. TMDB tv면 시즌 서브후보 펼침(SP5)
async function pickGenreCandidate(idx) {
  const c = genreCandidateCache[idx];
  if (!c) return;
  // 장르: AniList 후보만 매핑(TMDB는 포스터만 — C1)
  const result = mapGenres(c.genres, c.tags);
  if (result) document.getElementById('f-genre').value = result;   // C2: 덮어쓰기

  // TMDB tv 후보 → 시즌 서브후보 펼침(1기/2기 선택). movie/AniList는 즉시 확정.
  if (c.source === 'tmdb' && c.tvId) {
    const box = document.getElementById('genre-candidates');
    box.innerHTML = `<div class="genre-cand-head"><span>시즌 포스터 불러오는 중...</span></div>`;
    const seasons = await fetchSeasonPosters(c.tvId, c.posterUrl);
    if (seasons.length <= 1) {
      // 시즌 없음 → 본작 포스터 즉시 확정
      if (c.posterUrl) setPosterField(c.posterUrl);
      closeGenreCandidates();
    } else {
      renderSeasonCandidates(seasons);
    }
    return;
  }

  // TMDB movie / AniList → 포스터 즉시 확정
  if (c.posterUrl) setPosterField(c.posterUrl);
  if (!result && c.source === 'tmdb')
    document.getElementById('f-msg').textContent = 'TMDB 후보 — 포스터만 확정했어요. 장르는 AniList 후보나 수동 입력하세요.';
  else if (!result)
    document.getElementById('f-msg').textContent = '이 작품은 매핑 가능한 장르가 없어요 — 수동 입력하세요.';
  closeGenreCandidates();
}

// 시즌 서브후보 렌더 — 본작 + 시즌 1..N 포스터(C10 최대6) → 클릭 시 poster_url 확정
function renderSeasonCandidates(seasons) {
  seasonCandidateCache = seasons;
  const box = document.getElementById('genre-candidates');
  const cards = seasons.map((s, i) => `
    <div class="genre-cand" data-sidx="${i}">
      ${s.posterUrl ? `<img src="${esc(s.posterUrl.replace('/w500', '/w185'))}" alt="" loading="lazy">` : '<div style="width:40px;height:56px;flex:0 0 auto"></div>'}
      <div class="genre-cand-info">
        <div class="genre-cand-title">${esc(s.label)}</div>
        ${s.name ? `<div class="genre-cand-native">${esc(s.name)}</div>` : ''}
      </div>
    </div>`).join('');
  box.innerHTML = `<div class="genre-cand-head"><span>시즌 포스터 선택 (1기/2기)</span>
      <button type="button" id="genre-cand-close">닫기</button></div>${cards}`;
  box.style.display = 'flex';
  document.getElementById('genre-cand-close').addEventListener('click', closeGenreCandidates);
  box.querySelectorAll('.genre-cand').forEach(el => {
    el.addEventListener('click', () => {
      const s = seasonCandidateCache[+el.dataset.sidx];
      if (s?.posterUrl) setPosterField(s.posterUrl);
      closeGenreCandidates();
    });
  });
}

// 포스터 URL을 폼 hidden 필드 + 미리보기에 반영
function setPosterField(url) {
  const hidden = document.getElementById('f-poster');
  const preview = document.getElementById('f-poster-preview');
  if (hidden) hidden.value = url || '';
  if (preview) {
    if (url) { preview.src = url; preview.style.display = 'block'; }
    else { preview.removeAttribute('src'); preview.style.display = 'none'; }
  }
}

function closeGenreCandidates() {
  const box = document.getElementById('genre-candidates');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
  genreCandidateCache = [];
  seasonCandidateCache = [];
}

// ════════════════════════════════════════════════════════════════════════
//  포스터 검수 갤러리 (P5/C4) — 편집모드 전용. main을 전용 뷰로 교체.
// ════════════════════════════════════════════════════════════════════════
// posterReviewOpen 은 상태 변수 영역(상단)에 선언됨.

// 작품의 현재 표시 포스터 결정(라이브 호출 없이): poster_url → posters.json
function resolvedThumb(a) {
  return a.poster_url || POSTERS[a.title] || '';
}

function openPosterReview() {
  posterReviewOpen = true;
  const all = [...DATA.seasonal.flatMap(s => s.anime), ...DATA.classics];
  const withPoster = all.filter(a => resolvedThumb(a)).length;
  const cells = all.map(a => {
    const thumb = resolvedThumb(a);
    const noPoster = !thumb;
    return `<div class="review-cell ${noPoster ? 'no-poster' : ''}" data-id="${esc(String(a.id))}">
      ${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy">` : '<div class="rc-empty">포스터 없음</div>'}
      <div class="rc-title">${esc(a.title)}</div>
    </div>`;
  }).join('');
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="review-bar">
      <button class="add-quarter-btn" id="review-back">← 목록으로</button>
      <span class="review-progress">포스터 있음 <b>${withPoster}</b> / ${all.length}</span>
      <span class="review-progress" style="opacity:0.7">빈/틀린 포스터를 클릭해 교정하세요</span>
    </div>
    <div class="review-grid" id="review-grid">${cells}</div>`;

  document.getElementById('review-back').addEventListener('click', () => { posterReviewOpen = false; render(); });
  main.querySelectorAll('.review-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const anime = findAnimeById(cell.dataset.id);
      if (anime) openAnimeForm(anime);   // 편집 폼 재사용(포스터 후보검색+URL직접입력 포함)
    });
  });
}

async function saveAnimeForm(id, type) {
  const msg = document.getElementById('f-msg');
  const btn = document.getElementById('f-save');
  msg.textContent = '';
  const title = document.getElementById('f-title').value.trim();
  if (!title) { msg.textContent = '제목은 필수입니다.'; return; }

  const scoreRaw = document.getElementById('f-score').value.trim();
  let score = null;
  if (scoreRaw !== '') {
    score = parseFloat(scoreRaw);
    if (Number.isNaN(score) || score < 0 || score > 10) { msg.textContent = '점수는 0~10 사이여야 합니다.'; return; }
  }

  const note = document.getElementById('f-note').value.trim() || null;
  const genre = document.getElementById('f-genre').value.trim() || null;
  const poster_url = document.getElementById('f-poster').value.trim() || null;

  const payload = { title, score, type, note, genre, poster_url };
  if (type === 'seasonal') {
    const quarter = document.getElementById('f-quarter').value;
    if (!quarter) { msg.textContent = '분기를 선택하세요(없으면 먼저 분기를 추가).'; return; }
    const p = parseQuarter(quarter);
    payload.quarter = quarter;
    payload.year = p.year;
    payload.season = p.season;
  } else {
    payload.quarter = null; payload.year = null; payload.season = null;
  }

  btn.disabled = true; btn.textContent = '저장 중...';
  let error;
  if (id) ({ error } = await supabase.from('anime').update(payload).eq('id', id));
  else    ({ error } = await supabase.from('anime').insert(payload));
  btn.disabled = false; btn.textContent = '저장';
  if (error) { msg.textContent = '저장 실패: ' + error.message; return; }
  closeEditModal();
  try { await reloadData(); } catch (e) { alert('재로드 실패: ' + (e.message || e)); }
}

// ── 작품 삭제 (2단 확인 — Q3) ────────────────────────────
function confirmDeleteAnime(anime) {
  if (!anime) return;
  openEditModal(`
    <h3>작품 삭제</h3>
    <div class="edit-warn">⚠️ "<b>${esc(anime.title)}</b>"를 삭제합니다.<br>이 작업은 복구할 수 없습니다.</div>
    <div class="edit-actions">
      <button class="btn-secondary" id="d-cancel">취소</button>
      <button class="btn-primary btn-danger" id="d-confirm">삭제</button>
    </div>`);
  document.getElementById('d-cancel').addEventListener('click', closeEditModal);
  document.getElementById('d-confirm').addEventListener('click', async () => {
    const { error } = await supabase.from('anime').delete().eq('id', anime.id);
    if (error) { alert('삭제 실패: ' + error.message); return; }
    closeEditModal();
    try { await reloadData(); } catch (e) { alert('재로드 실패: ' + (e.message || e)); }
  });
}

// ════════════════════════════════════════════════════════════════════════
//  분기 추가/삭제 (quarters 테이블 행 조작 — 빈 분기 보존 D4)
// ════════════════════════════════════════════════════════════════════════
function openQuarterForm() {
  openEditModal(`
    <h3>새 분기 추가</h3>
    <div class="edit-field"><label>연도 (예: 2026)</label>
      <input type="number" id="q-year" min="2000" max="2099" placeholder="2026"></div>
    <div class="edit-field"><label>분기 (1~4)</label>
      <select id="q-season"><option value="1">1분기</option><option value="2">2분기</option>
        <option value="3">3분기</option><option value="4">4분기</option></select></div>
    <div class="edit-msg" id="q-msg"></div>
    <div class="edit-actions">
      <button class="btn-secondary" id="q-cancel">취소</button>
      <button class="btn-primary" id="q-save">추가</button>
    </div>`);
  document.getElementById('q-cancel').addEventListener('click', closeEditModal);
  document.getElementById('q-save').addEventListener('click', saveQuarterForm);
}

async function saveQuarterForm() {
  const msg = document.getElementById('q-msg');
  const btn = document.getElementById('q-save');
  msg.textContent = '';
  const year = parseInt(document.getElementById('q-year').value, 10);
  const season = parseInt(document.getElementById('q-season').value, 10);
  if (Number.isNaN(year) || year < 2000 || year > 2099) { msg.textContent = '연도를 올바르게 입력하세요(2000~2099).'; return; }
  // "26년 2분기" 형식 — 기존 표기와 동일하게 2자리 연도 사용
  const yy = String(year).slice(-2);
  const quarter = `${yy}년 ${season}분기`;
  if (DATA.quarters && DATA.quarters.some(q => q.quarter === quarter)) {
    msg.textContent = '이미 존재하는 분기입니다.'; return;
  }
  btn.disabled = true; btn.textContent = '추가 중...';
  const { error } = await supabase.from('quarters').insert({ quarter, year, season });
  btn.disabled = false; btn.textContent = '추가';
  if (error) { msg.textContent = '추가 실패: ' + error.message; return; }
  closeEditModal();
  try { await reloadData(); } catch (e) { alert('재로드 실패: ' + (e.message || e)); }
}

// ── 분기 삭제 (2단 확인 + "N편 삭제됩니다" 표시 — Q3) ────
function confirmDeleteQuarter(quarter) {
  const section = (DATA.seasonal || []).find(s => s.quarter === quarter);
  const count = section ? section.anime.length : 0;
  openEditModal(`
    <h3>분기 삭제</h3>
    <div class="edit-warn">⚠️ "<b>${esc(quarter)}</b>" 분기를 삭제합니다.<br>
      이 분기의 <b>작품 ${count}편이 함께 삭제</b>됩니다.<br>복구할 수 없습니다.</div>
    <div class="edit-actions">
      <button class="btn-secondary" id="dq-cancel">취소</button>
      <button class="btn-primary btn-danger" id="dq-confirm">${count}편과 분기 삭제</button>
    </div>`);
  document.getElementById('dq-cancel').addEventListener('click', closeEditModal);
  document.getElementById('dq-confirm').addEventListener('click', async () => {
    // 1) 해당 분기 작품 삭제 → 2) 분기 메타 삭제
    const delAnime = await supabase.from('anime').delete().eq('quarter', quarter);
    if (delAnime.error) { alert('작품 삭제 실패: ' + delAnime.error.message); return; }
    const delQ = await supabase.from('quarters').delete().eq('quarter', quarter);
    if (delQ.error) { alert('분기 삭제 실패: ' + delQ.error.message); return; }
    closeEditModal();
    try { await reloadData(); } catch (e) { alert('재로드 실패: ' + (e.message || e)); }
  });
}

// 세션 복원 시도 (이미 로그인돼 있으면 편집 모드 자동 ON)
